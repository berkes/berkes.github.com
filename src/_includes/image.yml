<figure class="decorative">
  <img src="{{ '/images' | append: page.id | append: '.png' | relative_url }}" alt="Woodcut from Doré. Purely illustrative" />
  {% if page.lang == "nl" %}
    <figcaption>Doré Houtsnede. De enige functie hiervan is een mooiere layout. En de gravures zijn gewoon mooi</figcaption>
  {% else %}
    <figcaption>Doré Woodcut. Its only function is to make the layout look better. And these images are really nice themselves</figcaption>
  {% endif %}
</figure>
