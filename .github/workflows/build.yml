---
name: Build Jekyll Site in Docker

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: tests/package-lock.json

    - name: Cache Cypress binary
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

    - name: Run Cypress end-to-end tests
      run: just test

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-artifacts
        path: |
          tests/cypress/screenshots
          tests/cypress/videos
          tests/cypress/snapshots/**/__diff_output__

  build:
    needs: test
    runs-on: ubuntu-latest

    container:
      image: docker.io/berkes/jekyll:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        path: 'jekyll'

    - name: Run Jekyll build
      env:
        BUNDLE_GEMFILE: "${{ github.workspace }}/jekyll/Gemfile"

      run: |
        cd jekyll
        bundle exec rake build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: site.zip
        path: jekyll/build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4.1.7
      with:
        name: site.zip

    - name: Set up S3cmd cli tool
      uses: s3-actions/s3cmd@v2.0.0
      with:
        provider: scaleway
        region: nl-ams
        access_key: ${{ secrets.SCALEWAY_ACCESS_KEY }}
        secret_key: ${{ secrets.SCALEWAY_SECRET_KEY }}

    - name: Deploy to object storage
      run: |
        s3cmd sync --recursive --delete-removed --acl-public --no-mime-magic --guess-mime-type ./ s3://berkes/
