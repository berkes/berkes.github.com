---
name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: tests/package-lock.json

    - name: Cache Cypress binary
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

    - name: Regenerate visual baselines (temporary, for Cypress 16 upgrade)
      run: just test --expose updateSnapshots=true --spec 'cypress/e2e/visual_regression.cy.js' || true

    - name: Run Cypress end-to-end tests
      run: just test

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-artifacts
        path: |
          tests/cypress/screenshots
          tests/cypress/videos
          tests/cypress/snapshots/**/__diff_output__

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger statichost.eu build webhook
      env:
        STATICHOST_TOKEN: ${{ secrets.STATICHOST_TOKEN }}
      run: |
        curl -sSf --max-time 60 -X POST \
          -H "Authorization: Bearer $STATICHOST_TOKEN" \
          https://builder.statichost.eu/berk-es
