{{ define "main" }}
<div class="split">
  <div class="split-half">
    <figure>
      {{ if eq .Params.lang "nl" }}
        <img src="/images/inline/ber_kessels.png" alt="Zwartwit portret van Bèr Kessels"/>
        <figcaption>Door <a href="https://fotomaurits.nl">Maurits van Ravesteijn</a>. Voor onze <a href="https://annaenber.nl/">Trouwfoto's</a></figcaption>
      {{ else }}
        <img src="/images/inline/ber_kessels.png" alt="Black and White portrait of Bèr
  Kessels"/>
        <figcaption>By <a href="https://fotomaurits.nl">Maurits van Ravesteijn</a>. From our <a href="https://annaenber.nl/">Weddingpictures</a></figcaption>
      {{ end }}
    </figure>
  </div>
  <div class="split-half">
    {{ .Content }}
  </div>
</div>
{{ end }}
