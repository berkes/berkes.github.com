{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>

    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"

{{ partialCached "about_pres.html" . }}
{{ end }}
