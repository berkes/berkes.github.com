{{ define "main" }}
<h1 class="row">{{ .Title }}</h1>
<div id="post" class="row">
  <div class="six columns">
    <figure>
      <img src="/images/inline/ber_kessels_presenting.png" alt="Bèr Kessels giving a presentation"/>
      <figcaption>By <a href="https://www.flickr.com/photos/incanus/4929415372/in/photostream/">Justin Miller</a>. CC-BY-NC 2.0</figcaption>
    </figure>
  </div>
  <div class="six columns">
    <ul class="posts">
    {{ range .Pages.ByDate.Reverse }}
    <li>
        <a href="{{ .RelPermalink }}">
            <span>
                {{ .Date.Format "January 02, 2006" }}
            </span>
            &raquo;
            <span>
                {{ .Params.location }}
            </span>
            &raquo;
            {{ .Title }}
        </a>
    </li>
    {{ end }}
    </ul>
  </div>
</div>
{{ end }}
