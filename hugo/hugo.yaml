baseURL: "https://berk.es"
title: "Bèr ‘berkes’ Kessels"
tagline: "Bèr Kessels is an Open Source Webdeveloper."
defaultContentLanguage: "en"
timezone: "Europe/Amsterdam"
publishDir: "build"
disableKinds: ["rss", "section", "sitemap"]
buildFuture: true

params:
  author:
    name: "Bèr ‘berkes’ Kessels"
    email: "ber@berk.es"
    github: "berkes"
    feedburner: "berkes"
  tagline: "Bèr Kessels is an Open Source Webdeveloper."

permalinks:
  posts: "/:year/:month/:day/:slug/"

outputs:
  home:
    - HTML
    - Atom
    - SitemapTxt

taxonomies:
  tag: "tags"

mediaTypes:
  text/plain:
    suffixes: ["txt"]

outputFormats:
  Atom:
    mediaType: "application/xml"
    baseName: "atom"
    isPlainText: false
    notAlternative: true
  SitemapTxt:
    mediaType: "text/plain"
    baseName: "sitemap"
    isPlainText: true
    notAlternative: true

# Static files (images, assets, legacy standalone pages) served from
# static-content/ at the site root.
staticDir: "static-content"

markup:
  goldmark:
    extensions:
      typographer: false
    renderer:
      unsafe: true

# Related posts ("Read on / Lees verder"): ranked by tag overlap
# (weight 80), falling back to recency (weight 10). Scoped to the
# current language by .RegularPagesRelated.
related:
  includeNewer: false
  indices:
    - name: tags
      weight: 80
    - name: date
      weight: 10
  threshold: 0
  toLower: true
